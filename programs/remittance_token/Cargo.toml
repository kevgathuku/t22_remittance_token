[package]
name = "remittance_token"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "remittance_token"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build",
             "anchor-spl/idl-build",
                ]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "1.2.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.2.2", features = ["token_2022", "token_2022_extensions"] }


[dev-dependencies]
litesvm = "0.16.0"
solana-keypair = "3.1.2"
solana-message = "4"
solana-signer = "3.0.1"
solana-transaction = "4"
solana-account = "4"
solana-system-interface = "3.2"
solana-instruction-error = "2"
solana-compute-budget-interface = "3"
solana-zk-sdk = "7"
spl-token-2022-interface = "3.1"
spl-token-confidential-transfer-proof-generation = "0.6"
solana-zk-elgamal-proof-interface = "0.1"
bytemuck = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
